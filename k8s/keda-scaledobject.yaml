apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: product-service-scaler
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-service
  pollingInterval: 15          # How often KEDA checks metrics (seconds)
  cooldownPeriod: 300          # Wait 5 min before scaling down
  minReplicaCount: 1           # Keep at least 1 pod running
  maxReplicaCount: 10          # Scale up to 10 pods max
  advanced:
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300  # Wait 5 min of low load before scaling down
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60   # Remove max 50% of pods per minute
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15   # Double pods every 15 seconds
            - type: Pods
              value: 4
              periodSeconds: 15   # Or add 4 pods every 15 seconds
          selectPolicy: Max
  triggers:
    # Trigger 1: CPU Utilization
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"  # Scale when CPU > 70%
    
    # Trigger 2: Memory Utilization
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"  # Scale when memory > 80%
    
    # Trigger 3: Application Metric - HTTP Request Rate
    # Requires Prometheus + Metrics Server setup
    - type: prometheus
      metadata:
        # serverAddress: http://cluster.local
        serverAddress: http://prometheus-service.default.svc.cluster.local:9090
        metricName: http_server_requests_seconds_count
        threshold: "100"  # Scale when > 100 req/sec per pod
        query: |
          sum(rate(http_server_requests_seconds_count{namespace="default"}[2m]))
        
